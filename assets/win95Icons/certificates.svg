<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Certificate body -->
  <rect x="4" y="3" width="24" height="18" fill="#FFFDE8" stroke="#000" stroke-width="1"/>
  <rect x="6" y="5" width="20" height="14" fill="none" stroke="#C0A030" stroke-width="1"/>
  <!-- Title line -->
  <line x1="10" y1="9" x2="22" y2="9" stroke="#333" stroke-width="1"/>
  <!-- Text lines -->
  <line x1="9" y1="12" x2="23" y2="12" stroke="#888" stroke-width="1"/>
  <line x1="11" y1="15" x2="21" y2="15" stroke="#888" stroke-width="1"/>
  <!-- Seal/ribbon -->
  <circle cx="16" cy="24" r="4" fill="#C41E3A" stroke="#8B0000" stroke-width="1"/>
  <circle cx="16" cy="24" r="2" fill="#FFD700"/>
  <!-- Ribbon tails -->
  <polygon points="13,27 11,31 14,29" fill="#C41E3A"/>
  <polygon points="19,27 21,31 18,29" fill="#C41E3A"/>
</svg>
